spring:
  mvc:
    async:
      request-timeout: 10m
  ai:
    openai:
      base-url: https://api.z.ai/api/coding/paas/v4
      api-key: ${OPENROUTER_API_KEY}
      chat:
        model: glm-5.3
  threads:
    virtual:
      enabled: true
  application:
    name: wise-task-ai
  data:
    redis:
      host: ${REDIS_APP_NAME:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  jpa:
    generate-ddl: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    url: jdbc:postgresql://${DB:localhost}:5432/${AI_DB:wise_task_ai}
    username: ${AI_DB_USER:wise_task_ai}
    password: ${AI_DB_PASSWORD:wise_task_ai}
    driver-class-name: org.postgresql.Driver
  graphql:
    graphiql:
      enabled: true
    http:
      path: /ai
    websocket:
      path: /ai
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3150}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,OPTIONS}
  liquibase:
    url: jdbc:postgresql://${DB:localhost}:${DB_PORT:5432}/${AI_DB:wise_task_ai}
    user: ${AI_DB_USER:wise_task_ai}
    password: ${AI_DB_PASSWORD:wise_task_ai}
    change-log: classpath:db/database-changelog.xml
    enabled: true

server:
  port: 8055

security:
  jwt:
    public-key: file:src/main/resources/certs/public.pem
    issuer: wise-task
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3150}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: "*"
    allow-credentials: ${CORS_ALLOWED_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

app:
  cache:
    ttl: 1h
  oauth2:
    trusted-issuers:
      google-issuer: ${GOOGLE_ISSUER:https://accounts.google.com}

grpc:
  service:
    graph:
      host: ${GRAPH_GRPC_PORT:localhost}
      port: ${GRAPH_GRPC_PORT:6565}
    profile:
      host: ${PROFILE_APP_NAME:localhost}
      port: ${PROFILE_GRPC_PORT:6567}
    plugin:
      host: ${PLUGIN_APP_NAME:localhost}
      port: ${PLUGIN_GRPC_PORT:6566}
    task:
      host: ${TASK_APP_NAME:localhost}
      port: ${TASK_GRPC_PORT:6568}
    statistics:
      host: ${EVENT_APP_NAME:localhost}
      port: ${EVENT_GRPC_PORT:6569}

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://${TEMPO_HOST:localhost}:${TEMPO_PORT:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

logging:
  level:
    org.springframework.graphql: DEBUG
    org.springframework.graphql.execution: TRACE
    graphql: DEBUG
    org.springframework.web.socket: DEBUG
    root: info